{{ define "main" }}
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
  </header>
  <div class="post-content">
    {{ .Content }}

    <div class="swoptimal-lookup-filters">
      <label>Frame
        <select id="field-frame"></select>
      </label>
      <label>Engine
        <select id="field-engine"></select>
      </label>
    </div>

    <div id="swoptimal-build-results"></div>

    <p>
      <button id="swoptimal-search-combo" type="button" disabled>Search ih8mud for this combo</button>
      <button id="swoptimal-submit-data" type="button">Submit a build thread</button>
    </p>
  </div>
</article>

{{ $js := resources.Get "js/build-lookup-app.js" | js.Build (dict "targetPath" "js/build-lookup-app.js") | resources.Minify | resources.Fingerprint }}
<script>
  window.SWOPTIMAL_CONFIG = { apiBase: "{{ "api/" | relURL }}" };
</script>
<script type="module" src="{{ $js.RelPermalink }}" defer></script>
{{ end }}
